name: Compilar APK Android para GreenAir QC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Preparar carpeta web para Capacitor
        run: |
          mkdir -p www
          # Movemos los archivos web esenciales a la carpeta www (excluyendo carpetas del sistema como .git, android, .github)
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'android' ! -name '.github' ! -name 'www' -exec mv {} www/ \;

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK v1 generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GreenAir-QC-v1.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
