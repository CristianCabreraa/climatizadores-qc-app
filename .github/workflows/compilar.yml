name: Compilar APK Android para GreenAir QC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Crear carpeta www y organizar archivos web
        run: |
          mkdir -p www
          # Copiamos todos los archivos HTML, CSS, JS y assets principales a la carpeta www
          # (excluyendo carpetas internas como .git, android, .github y la misma www)
          for item in *; do
            if [ "$item" != "android" ] && [ "$item" != ".github" ] && [ "$item" != "www" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK v1 generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GreenAir-QC-v1.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
